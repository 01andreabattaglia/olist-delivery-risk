[project]
name = "olist-delivery-risk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AndreaBattaa", email = "01andreabattaglia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
olist-delivery-risk = "olist_delivery_risk:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100